name: Build Desktop

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ============ Web Build Verification ============
  web-build:
    name: Web Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: './pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Web
        working-directory: ./web
        run: pnpm build

  # ============ Linux x64 ============
  build-linux-x64:
    name: Linux x64
    runs-on: ubuntu-latest
    needs: web-build
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: './pnpm-lock.yaml'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libkrb5-dev \
            patchelf \
            build-essential \
            xdg-utils \
            libfuse2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri
        working-directory: ./web
        run: pnpm tauri build --bundles deb,rpm,appimage --target x86_64-unknown-linux-gnu

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: linux-x64
          if-no-files-found: error
          path: |
            web/src-tauri/target/**/bundle/deb/*.deb
            web/src-tauri/target/**/bundle/rpm/*.rpm
            web/src-tauri/target/**/bundle/appimage/*.AppImage

  # ============ Linux ARM64 ============
  # 说明：使用原生 ARM64 runner（ubuntu-24.04-arm，公开仓库免费），不做交叉编译。
  # 之前在 x86_64 runner 上交叉编译（--target aarch64-unknown-linux-gnu + PKG_CONFIG_ALLOW_CROSS=1）
  # 会把宿主机的 x86_64 GTK/WebKit 库交给 aarch64 链接器，导致：
  #   collect2: error: ld returned 1 exit status
  #   error: could not compile `hanphone-blog` (lib) due to 1 previous error
  # 原生构建可完全避免 sysroot/pkg-config 跨架构问题，产物也更可靠。
  build-linux-arm64:
    name: Linux ARM64
    runs-on: ubuntu-24.04-arm
    needs: web-build
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: './pnpm-lock.yaml'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libkrb5-dev \
            patchelf \
            build-essential \
            xdg-utils \
            libfuse2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri
        working-directory: ./web
        run: pnpm tauri build --bundles deb,rpm,appimage

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: linux-arm64
          if-no-files-found: error
          path: |
            web/src-tauri/target/**/bundle/deb/*.deb
            web/src-tauri/target/**/bundle/rpm/*.rpm
            web/src-tauri/target/**/bundle/appimage/*.AppImage

  # ============ Windows x64 ============
  build-windows-x64:
    name: Windows x64
    runs-on: windows-latest
    needs: web-build
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: './pnpm-lock.yaml'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri
        working-directory: ./web
        run: pnpm tauri build --bundles msi,nsis --target x86_64-pc-windows-msvc

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: windows-x64
          if-no-files-found: error
          path: |
            web/src-tauri/target/**/bundle/msi/*.msi
            web/src-tauri/target/**/bundle/nsis/*.exe

  # ============ Windows ARM64 ============
  build-windows-arm64:
    name: Windows ARM64
    runs-on: windows-latest
    needs: web-build
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: './pnpm-lock.yaml'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri NSIS only (MSI not supported on ARM64)
        working-directory: ./web
        run: pnpm tauri build --bundles nsis --target aarch64-pc-windows-msvc

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: windows-arm64
          if-no-files-found: error
          path: |
            web/src-tauri/target/**/bundle/nsis/*.exe

  # ============ Release ============
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-linux-x64, build-linux-arm64, build-windows-x64, build-windows-arm64]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts
          merge-multiple: true

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/linux-x64/*
            artifacts/linux-arm64/*
            artifacts/windows-x64/*
            artifacts/windows-arm64/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
