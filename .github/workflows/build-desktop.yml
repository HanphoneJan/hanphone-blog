name: Build Desktop

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ============ Web Build Verification ============
  web-build:
    name: Web Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: './pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Web
        working-directory: ./web
        run: pnpm build

  # ============ Linux x64 ============
  build-linux-x64:
    name: Linux x64
    runs-on: ubuntu-latest
    needs: web-build
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: './pnpm-lock.yaml'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libkrb5-dev \
            patchelf \
            build-essential

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri
        working-directory: ./web
        run: pnpm tauri build --bundles deb,rpm,appimage --target x86_64-unknown-linux-gnu

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: linux-x64
          path: |
            web/src-tauri/target/release/bundle/deb/*.deb
            web/src-tauri/target/release/bundle/rpm/*.rpm
            web/src-tauri/target/release/bundle/appimage/*.AppImage

  # ============ Linux ARM64 ============
  build-linux-arm64:
    name: Linux ARM64
    runs-on: ubuntu-latest
    needs: web-build
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: './pnpm-lock.yaml'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Install cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libkrb5-dev \
            patchelf \
            build-essential

      - name: Configure cross-compilation environment
        run: |
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++" >> $GITHUB_ENV
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> $GITHUB_ENV

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri
        working-directory: ./web
        run: pnpm tauri build --bundles deb,rpm,appimage --target aarch64-unknown-linux-gnu

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: linux-arm64
          path: |
            web/src-tauri/target/release/bundle/deb/*.deb
            web/src-tauri/target/release/bundle/rpm/*.rpm
            web/src-tauri/target/release/bundle/appimage/*.AppImage

  # ============ Windows x64 ============
  build-windows-x64:
    name: Windows x64
    runs-on: windows-latest
    needs: web-build
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: './pnpm-lock.yaml'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri
        working-directory: ./web
        run: pnpm tauri build --bundles msi,nsis --target x86_64-pc-windows-msvc

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: windows-x64
          path: |
            web/src-tauri/target/release/bundle/msi/*.msi
            web/src-tauri/target/release/bundle/nsis/*.exe

  # ============ Windows ARM64 ============
  build-windows-arm64:
    name: Windows ARM64
    runs-on: windows-latest
    needs: web-build
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: './pnpm-lock.yaml'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri NSIS only (MSI not supported on ARM64)
        working-directory: ./web
        run: pnpm tauri build --bundles nsis --target aarch64-pc-windows-msvc

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: windows-arm64
          path: |
            web/src-tauri/target/release/bundle/nsis/*.exe

  # ============ Release ============
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-linux-x64, build-linux-arm64, build-windows-x64, build-windows-arm64]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts
          merge-multiple: true

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/linux-x64/*
            artifacts/linux-arm64/*
            artifacts/windows-x64/*
            artifacts/windows-arm64/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
